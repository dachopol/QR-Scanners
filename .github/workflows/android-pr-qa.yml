name: Android PR QA (no signing, no deploy)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/android-pr-qa.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"

permissions:
  contents: read

concurrency:
  group: android-pr-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Verified PR HEAD: $EXPECTED_SHA"
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"
      - name: Verify TH/EN string parity
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          def keys(path):
              return set(re.findall(r'<string\s+name="([^"]+)"', Path(path).read_text(encoding="utf-8")))
          en = keys("app/src/main/res/values/strings.xml")
          th = keys("app/src/main/res/values-th/strings.xml")
          if en != th:
              raise SystemExit(f"Missing TH={sorted(en - th)}; missing EN={sorted(th - en)}")
          print(f"TH/EN key parity PASS ({len(en)} each)")
          PY
      - name: Run Android unit tests, lint and debug build
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Print test evidence checksums
        if: success()
        run: |
          find app/build/test-results/testDebugUnitTest -type f -name "*.xml" -print0 | sort -z | xargs -0 -r sha256sum

# This PR-only gate intentionally has no credentials, release signing,
# artifact upload, production deploy, remote execution or physical-device claim.

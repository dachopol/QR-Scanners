name: Android Release Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare release signing when secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/qr-scanners-upload.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"
            test -s "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
          fi

      - name: Source-of-truth hygiene
        run: |
          ! grep -R -n -E 'com\.aistudio|zipspeed|quickqr|qrprom' app/src app/build.gradle.kts build.gradle.kts gradle/libs.versions.toml
          ! grep -n -E 'firebase|retrofit|okhttp|moshi|google-services|secrets-gradle|google-devtools-ksp' app/build.gradle.kts build.gradle.kts gradle/libs.versions.toml
          ! grep -n 'mutableStateOf("13.7563")\|mutableStateOf("100.5018")' app/src/main/java/com/anakinyoo/qrscanners/ui/App.kt
          ! grep -R -n -E 'contentDescription[[:space:]]*=[[:space:]]*"|Toast\.makeText\([^,]+,[[:space:]]*"' app/src/main/java
          ! grep -R -n -E 'Text\([[:space:]]*"' app/src/main/java/com/anakinyoo/qrscanners/ui
          python3 - <<'PY'
          import re
          from pathlib import Path
          def keys(path):
              text = Path(path).read_text(encoding="utf-8")
              return set(re.findall(r'<string\s+name="([^"]+)"', text))
          en = keys("app/src/main/res/values/strings.xml")
          th = keys("app/src/main/res/values-th/strings.xml")
          missing_th = sorted(en - th)
          missing_en = sorted(th - en)
          if missing_th or missing_en:
              raise SystemExit(f"String resource mismatch: missing_th={missing_th}, missing_en={missing_en}")
          PY
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          ! grep -q 'ACCESS_BACKGROUND_LOCATION' app/src/main/AndroidManifest.xml

      - name: Unit, lint and builds
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle --no-daemon \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Verify 16 KB APK alignment
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"

      - name: Release signing status
        run: |
          if [ "$RELEASE_SIGNING_CONFIGURED" = "true" ]; then
            APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
            AAB="$(find app/build/outputs/bundle/release -name '*.aab' | head -n 1)"
            test -n "$APK"
            test -n "$AAB"
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
            jarsigner -verify "$AAB"
            echo "PASS: release APK and AAB are signed and signature verification succeeded."
          else
            echo "TO VERIFY: release signing secrets are not configured in CI; release artifacts are unsigned."
          fi

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: qr-scanners-release-gate
          if-no-files-found: error
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/
